name: Check SDG data for updates

on:
  schedule:
    - cron: '0 8 * * *'   # every day — adjust as needed (min hour day month weekday)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write        # needed by the final step that pushes last_hash.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (to read/write the stored hash)
        uses: actions/checkout@v4

      - name: Download the current Excel file and hash it
        id: hash
        run: |
          curl -sSfL --retry 3 --retry-delay 5 \
            "https://alt2008.github.io/SDG-monitor/SDG_data.xlsx" -o current.xlsx
          NEW_HASH=$(sha256sum current.xlsx | awk '{print $1}')
          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"

      - name: Compare against last known hash
        id: compare
        run: |
          if [ -f last_hash.txt ]; then
            OLD_HASH=$(cat last_hash.txt)
          else
            OLD_HASH=""
          fi
          echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"
          if [ "$OLD_HASH" != "${{ steps.hash.outputs.new_hash }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email if the data changed
        if: steps.compare.outputs.changed == 'true' && steps.compare.outputs.old_hash != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "SDG dashboard data updated"
          to: altansuvd.tumursukh@un.org
          from: SDG Monitor
          body: "SDG_data.xlsx changed. New hash: ${{ steps.hash.outputs.new_hash }}"

      - name: Save the new hash for next run
        run: echo "${{ steps.hash.outputs.new_hash }}" > last_hash.txt

      - name: Commit updated hash back to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_hash.txt
          git diff --staged --quiet || git commit -m "Update data hash"
          git push
